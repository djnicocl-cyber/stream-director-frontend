<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pantalla &mdash; Stream Director</title>
<link rel="stylesheet" href="style.css"/>
<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;}

/* ===== PANTALLA PRINCIPAL ===== */
#screenView{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;}
#screenVideo{width:100vw;height:100vh;object-fit:contain;object-position:center;display:block;}

/* ===== WAITING ===== */
#waitingScreen{
  position:fixed;inset:0;background:#0a0a0a;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;z-index:10;
    }
    .broadcast-title{
      font-size:72px;font-weight:900;letter-spacing:-2px;
        background:linear-gradient(135deg,#e8002d 0%,#ff6b6b 100%);
          -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
          }
          .waiting-dots{display:flex;gap:12px;}
          .waiting-dots span{width:12px;height:12px;border-radius:50%;background:#e8002d;animation:dot-bounce 1.4s ease-in-out infinite;}
          .waiting-dots span:nth-child(2){animation-delay:.2s;}
          .waiting-dots span:nth-child(3){animation-delay:.4s;}
          @keyframes dot-bounce{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1.2);opacity:1}}
          
          /* ===== OVERLAY CON NOMBRE ANIMADO ===== */
          #screenOverlay{
            position:fixed;bottom:0;left:0;right:0;
              background:linear-gradient(transparent,rgba(0,0,0,.8));
                padding:60px 32px 28px;
                  display:flex;align-items:flex-end;justify-content:space-between;
                    z-index:5;pointer-events:none;
                    }
                    .live-pill{
                      background:#e8002d;color:#fff;
                        font-size:12px;font-weight:900;letter-spacing:4px;
                          padding:7px 16px;border-radius:5px;
                            text-transform:uppercase;
                              animation:pulse-badge 1.5s ease-in-out infinite;
                                flex-shrink:0;
                                }
                                @keyframes pulse-badge{0%,100%{box-shadow:0 0 0 0 rgba(232,0,45,.5)}50%{box-shadow:0 0 0 10px rgba(232,0,45,0)}}
                                .live-time{font-size:14px;color:rgba(255,255,255,.8);font-weight:700;letter-spacing:2px;font-variant-numeric:tabular-nums;flex-shrink:0;}
                                
                                /* ===== NOMBRE ARTISTA — ANIMACION ENTRADA ===== */
                                #artistNameWrap{
                                  flex:1;
                                    overflow:hidden;
                                      margin:0 20px;
                                        display:flex;
                                          align-items:flex-end;
                                          }
                                          #artistName{
                                            font-size:36px;
                                              font-weight:900;
                                                color:#fff;
                                                  text-shadow:0 2px 20px rgba(0,0,0,1);
                                                    letter-spacing:2px;
                                                      white-space:nowrap;
                                                        overflow:hidden;
                                                          text-overflow:ellipsis;
                                                            /* Animacion de entrada */
                                                              transform:translateY(60px);
                                                                opacity:0;
                                                                  transition:transform 0.6s cubic-bezier(0.16,1,0.3,1), opacity 0.5s ease;
                                                                  }
                                                                  #artistName.visible{
                                                                    transform:translateY(0);
                                                                      opacity:1;
                                                                      }
                                                                      /* Linea decorativa bajo el nombre */
                                                                      #artistNameWrap::before{
                                                                        content:'';
                                                                          display:none;
                                                                          }
                                                                          .name-container{
                                                                            display:flex;
                                                                              flex-direction:column;
                                                                                gap:4px;
                                                                                  overflow:hidden;
                                                                                  }
                                                                                  .name-label{
                                                                                    font-size:10px;
                                                                                      font-weight:700;
                                                                                        letter-spacing:3px;
                                                                                          color:#e8002d;
                                                                                            text-transform:uppercase;
                                                                                              transform:translateY(20px);
                                                                                                opacity:0;
                                                                                                  transition:transform 0.5s cubic-bezier(0.16,1,0.3,1) 0.1s, opacity 0.4s ease 0.1s;
                                                                                                  }
                                                                                                  .name-label.visible{
                                                                                                    transform:translateY(0);
                                                                                                      opacity:1;
                                                                                                      }
                                                                                                      .name-bar{
                                                                                                        height:3px;
                                                                                                          background:linear-gradient(90deg,#e8002d,transparent);
                                                                                                            width:0;
                                                                                                              transition:width 0.8s cubic-bezier(0.16,1,0.3,1) 0.2s;
                                                                                                                border-radius:2px;
                                                                                                                }
                                                                                                                .name-bar.visible{width:100%;}
                                                                                                                
                                                                                                                /* ===== SETUP ===== */
                                                                                                                #setupPanel{position:fixed;inset:0;background:#0a0a0a;display:flex;align-items:center;justify-content:center;z-index:20;}
                                                                                                                .setup-card{background:#111;border:1px solid #222;border-radius:14px;padding:40px;width:100%;max-width:420px;}
                                                                                                                .setup-card h2{font-size:22px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#fff;text-align:center;margin-bottom:8px;}
                                                                                                                .setup-card .hint{font-size:13px;color:#666;text-align:center;margin-bottom:28px;}
                                                                                                                .form-group{margin-bottom:16px;}
                                                                                                                .form-group label{display:block;font-size:11px;color:#888;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
                                                                                                                .form-group input{width:100%;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;color:#fff;padding:11px 14px;font-size:15px;outline:none;}
                                                                                                                .form-group input:focus{border-color:#e8002d;}
                                                                                                                .btn-start{width:100%;background:#22c55e;color:#fff;border:none;border-radius:10px;padding:14px;font-size:16px;font-weight:800;cursor:pointer;letter-spacing:1px;}
                                                                                                                .btn-start:hover{background:#16a34a;}
                                                                                                                .setup-tip{font-size:11px;color:#444;text-align:center;margin-top:12px;}
                                                                                                                .alert-error{background:#2a0a0a;border:1px solid #e8002d;border-radius:8px;color:#ff6b6b;padding:10px 12px;font-size:13px;margin-bottom:14px;}
                                                                                                                </style>
                                                                                                                </head>
                                                                                                                <body>
                                                                                                                
                                                                                                                <!-- SETUP -->
                                                                                                                <div id="setupPanel">
                                                                                                                  <div class="setup-card">
                                                                                                                      <div style="text-align:center;font-size:44px;margin-bottom:16px;">&#128250;</div>
                                                                                                                          <h2>Vista Pantalla</h2>
                                                                                                                              <p class="hint">Proyecci&oacute;n del streamer seleccionado</p>
                                                                                                                                  <div id="setupAlert" style="display:none;" class="alert-error"></div>
                                                                                                                                      <div class="form-group">
                                                                                                                                            <label>ID de la Sala</label>
                                                                                                                                                  <input type="text" id="roomId" placeholder="Ej: SALA-PRINCIPAL"/>
                                                                                                                                                      </div>
                                                                                                                                                          <button class="btn-start" onclick="startScreen()">&#128250; Iniciar pantalla</button>
                                                                                                                                                              <p class="setup-tip">Se recomienda pantalla completa (F11)</p>
                                                                                                                                                                </div>
                                                                                                                                                                </div>
                                                                                                                                                                
                                                                                                                                                                <!-- WAITING -->
                                                                                                                                                                <div id="waitingScreen" style="display:none;">
                                                                                                                                                                  <div class="broadcast-title">STREAM DIRECTOR</div>
                                                                                                                                                                    <div style="text-align:center;">
                                                                                                                                                                        <p style="font-size:14px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:#444;margin-bottom:20px;">EN ESPERA DE SE&Ntilde;AL</p>
                                                                                                                                                                            <div class="waiting-dots"><span></span><span></span><span></span></div>
                                                                                                                                                                              </div>
                                                                                                                                                                                <div style="display:flex;align-items:center;gap:10px;opacity:.4;">
                                                                                                                                                                                    <span style="width:8px;height:8px;border-radius:50%;background:#f0a500;animation:dot-bounce 1.5s step-start infinite;display:inline-block;"></span>
                                                                                                                                                                                        <span style="font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#666;">Sala: <span id="waitRoomId"></span></span>
                                                                                                                                                                                          </div>
                                                                                                                                                                                          </div>
                                                                                                                                                                                          
                                                                                                                                                                                          <!-- PANTALLA EN VIVO -->
                                                                                                                                                                                          <div id="screenView" style="display:none;">
                                                                                                                                                                                            <video id="screenVideo" autoplay playsinline></video>
                                                                                                                                                                                              <audio id="screenAudio" autoplay></audio>
                                                                                                                                                                                              
                                                                                                                                                                                                <div id="screenOverlay">
                                                                                                                                                                                                    <!-- LADO IZQUIERDO: pill + nombre -->
                                                                                                                                                                                                        <div style="display:flex;align-items:flex-end;gap:16px;flex:1;overflow:hidden;">
                                                                                                                                                                                                              <div class="live-pill">&#x25CF; EN VIVO</div>
                                                                                                                                                                                                                    <div id="artistNameWrap">
                                                                                                                                                                                                                            <div class="name-container" id="nameContainer">
                                                                                                                                                                                                                                      <div class="name-label" id="nameLabel">EN ESCENA</div>
                                                                                                                                                                                                                                                <div id="artistName"></div>
                                                                                                                                                                                                                                                          <div class="name-bar" id="nameBar"></div>
                                                                                                                                                                                                                                                                  </div>
                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                <!-- LADO DERECHO: timer -->
                                                                                                                                                                                                                                                                                    <div class="live-time" id="liveTimer">00:00</div>
                                                                                                                                                                                                                                                                                      </div>
                                                                                                                                                                                                                                                                                      </div>
                                                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                                                      <script>
                                                                                                                                                                                                                                                                                      const BACKEND='https://stream-director-backend-v2.onrender.com';
                                                                                                                                                                                                                                                                                      const LIVEKIT_URL='wss://stream-director-13gpu9p5.livekit.cloud';
                                                                                                                                                                                                                                                                                      let room=null,currentRoomId='',currentSelected=null,pollInterval=null;
                                                                                                                                                                                                                                                                                      let liveStartTime=null,timerInterval=null;
                                                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                                                      window.addEventListener('DOMContentLoaded',()=>{
                                                                                                                                                                                                                                                                                        const s=localStorage.getItem('sd_room_id');
                                                                                                                                                                                                                                                                                          if(s)document.getElementById('roomId').value=s;
                                                                                                                                                                                                                                                                                          });
                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                          async function startScreen(){
                                                                                                                                                                                                                                                                                            const roomId=document.getElementById('roomId').value.trim().toUpperCase();
                                                                                                                                                                                                                                                                                              const a=document.getElementById('setupAlert');a.style.display='none';
                                                                                                                                                                                                                                                                                                if(!roomId){a.style.display='block';a.textContent='Ingresa el ID de la sala';return;}
                                                                                                                                                                                                                                                                                                  try{
                                                                                                                                                                                                                                                                                                      const r=await fetch(BACKEND+'/api/token/screen',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({roomId,identity:'pantalla-'+Date.now()})});
                                                                                                                                                                                                                                                                                                          const d=await r.json();if(!r.ok)throw new Error(d.error||'Error');
                                                                                                                                                                                                                                                                                                              currentRoomId=roomId;localStorage.setItem('sd_room_id',roomId);
                                                                                                                                                                                                                                                                                                                  room=new LivekitClient.Room();
                                                                                                                                                                                                                                                                                                                      setupRoomEvents();
                                                                                                                                                                                                                                                                                                                          await room.connect(LIVEKIT_URL,d.token);
                                                                                                                                                                                                                                                                                                                              document.getElementById('setupPanel').style.display='none';
                                                                                                                                                                                                                                                                                                                                  document.getElementById('waitingScreen').style.display='flex';
                                                                                                                                                                                                                                                                                                                                      document.getElementById('waitRoomId').textContent=roomId;
                                                                                                                                                                                                                                                                                                                                          startPolling();
                                                                                                                                                                                                                                                                                                                                            }catch(e){a.style.display='block';a.textContent='Error: '+e.message;}
                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                            function setupRoomEvents(){
                                                                                                                                                                                                                                                                                                                                              room.on(LivekitClient.RoomEvent.TrackSubscribed,(track,pub,participant)=>{
                                                                                                                                                                                                                                                                                                                                                  if(track.kind==='video'&&participant.identity===currentSelected)attachVideo(track,participant.identity);
                                                                                                                                                                                                                                                                                                                                                      if(track.kind==='audio'&&participant.identity===currentSelected)attachAudio(track);
                                                                                                                                                                                                                                                                                                                                                        });
                                                                                                                                                                                                                                                                                                                                                          room.on(LivekitClient.RoomEvent.TrackUnsubscribed,(track,pub,participant)=>{
                                                                                                                                                                                                                                                                                                                                                              if(participant.identity===currentSelected)showWaiting();
                                                                                                                                                                                                                                                                                                                                                                });
                                                                                                                                                                                                                                                                                                                                                                  room.on(LivekitClient.RoomEvent.ParticipantDisconnected,p=>{
                                                                                                                                                                                                                                                                                                                                                                      if(p.identity===currentSelected){showWaiting();currentSelected=null;}
                                                                                                                                                                                                                                                                                                                                                                        });
                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                        function prettyName(id){
                                                                                                                                                                                                                                                                                                                                                                          if(!id)return '';
                                                                                                                                                                                                                                                                                                                                                                            // Formato: streamer_NOMBRE_timestamp → extraer NOMBRE
                                                                                                                                                                                                                                                                                                                                                                              const m=String(id).match(/^streamer_(.+)_\d+$/i);
                                                                                                                                                                                                                                                                                                                                                                                if(m)return m[1].replace(/-/g,' ');
                                                                                                                                                                                                                                                                                                                                                                                  return id;
                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                  
                                                                                                                                                                                                                                                                                                                                                                                  function startPolling(){
                                                                                                                                                                                                                                                                                                                                                                                    pollInterval=setInterval(async()=>{
                                                                                                                                                                                                                                                                                                                                                                                        try{
                                                                                                                                                                                                                                                                                                                                                                                              const r=await fetch(BACKEND+'/api/rooms/'+currentRoomId+'/selected');
                                                                                                                                                                                                                                                                                                                                                                                                    const d=await r.json();
                                                                                                                                                                                                                                                                                                                                                                                                          const ns=d.selected||null;
                                                                                                                                                                                                                                                                                                                                                                                                                if(ns!==currentSelected){
                                                                                                                                                                                                                                                                                                                                                                                                                        currentSelected=ns;
                                                                                                                                                                                                                                                                                                                                                                                                                                if(!currentSelected){showWaiting();return;}
                                                                                                                                                                                                                                                                                                                                                                                                                                        const p=room.remoteParticipants.get(currentSelected);
                                                                                                                                                                                                                                                                                                                                                                                                                                                if(p){
                                                                                                                                                                                                                                                                                                                                                                                                                                                          let foundVideo=false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    p.videoTrackPublications.forEach(pub=>{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if(pub.track&&pub.isSubscribed){attachVideo(pub.track,p.identity);foundVideo=true;}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    p.audioTrackPublications.forEach(pub=>{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if(pub.track&&pub.isSubscribed)attachAudio(pub.track);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if(!foundVideo)showWaiting();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }else{showWaiting();}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }catch(e){}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        },1500);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        /* ===== NOMBRE ANIMADO ===== */
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        function mostrarNombreAnimado(nombre){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const nameEl=document.getElementById('artistName');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const labelEl=document.getElementById('nameLabel');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const barEl=document.getElementById('nameBar');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                // Reset animacion
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  nameEl.classList.remove('visible');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    labelEl.classList.remove('visible');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      barEl.classList.remove('visible');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        nameEl.textContent=nombre;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          // Trigger animacion con pequeño delay
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            requestAnimationFrame(()=>{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                requestAnimationFrame(()=>{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      nameEl.classList.add('visible');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            labelEl.classList.add('visible');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  barEl.classList.add('visible');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        function ocultarNombreAnimado(){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const nameEl=document.getElementById('artistName');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const labelEl=document.getElementById('nameLabel');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const barEl=document.getElementById('nameBar');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                nameEl.classList.remove('visible');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  labelEl.classList.remove('visible');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    barEl.classList.remove('visible');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function attachVideo(track,identity){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const v=document.getElementById('screenVideo');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        track.attach(v);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          v.style.width='100vw';v.style.height='100vh';v.style.objectFit='contain';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById('waitingScreen').style.display='none';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              document.getElementById('screenView').style.display='flex';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                // Mostrar nombre con animacion
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  mostrarNombreAnimado(prettyName(identity));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    startTimer();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
