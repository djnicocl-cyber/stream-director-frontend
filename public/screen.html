                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function attachAudio(track){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      let a=document.getElementById('screenAudio');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if(!a){a=document.createElement('audio');a.id='screenAudio';a.autoplay=true;document.body.appendChild(a);}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          track.attach(a);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          function showWaiting(){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ocultarNombreAnimado();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              document.getElementById('screenView').style.display='none';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById('waitingScreen').style.display='flex';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  stopTimer();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const v=document.getElementById('screenVideo');v.srcObject=null;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    /* ===== TIMER ===== */
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function startTimer(){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      stopTimer();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        liveStartTime=Date.now();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          timerInterval=setInterval(()=>{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const sec=Math.floor((Date.now()-liveStartTime)/1000);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const m=String(Math.floor(sec/60)).padStart(2,'0');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const s=String(sec%60).padStart(2,'0');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          document.getElementById('liveTimer').textContent=m+':'+s;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            },1000);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            function stopTimer(){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if(timerInterval)clearInterval(timerInterval);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                timerInterval=null;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  document.getElementById('liveTimer').textContent='00:00';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  window.addEventListener('beforeunload',()=>{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if(room)room.disconnect();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if(pollInterval)clearInterval(pollInterval);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        stopTimer();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </body>
